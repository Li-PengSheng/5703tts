default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        name: ruff check (fix)
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        stages: [pre-push]
      - id: ruff-format
        name: ruff format (check)
        args: [--check]
        stages: [pre-push]
