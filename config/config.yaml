tts:
  # Production default. Switch explicitly to cosyvoice for the backup backend;
  # the renderer never falls back automatically.
  engine: higgs
  higgs:
    # Production placeholders: provision these external assets before runtime.
    server_executable: /path/to/sgl-omni
    model_dir: /path/to/higgs
    host: 127.0.0.1
    port: 18080
    startup_timeout_seconds: 900
    inference_timeout_seconds: 300
    ffmpeg_bin: ffmpeg
  cosyvoice:
    # Explicit backup/secondary production backend.
    # CosyVoice3's dependencies live in their own virtual environment,
    # separate from this project's .venv, so synthesis runs in a subprocess
    # started with this interpreter (paths below are relative to the repo
    # root unless given as absolute paths).
    # Semantic rate/speed and arousal/affect instruction mappings are
    # provisional backend adapters pending controlled benchmark evaluation.
    python_bin: third_party/CosyVoice/.venv/bin/python
    repo_dir: third_party/CosyVoice
    model_dir: models/Fun-CosyVoice3-0.5B
    load_trt: false
    load_vllm: false
    fp16: true
  # Speaker references for either engine come only from --speaker-sidecar.

# Short fade applied to the beginning and end of each turn (milliseconds).
# It removes hard-cut clicks without crossfading turns or affecting metadata timestamps.
fade_ms: 5

telephone:
  sample_rate: 8000
  channels: 1
  high_pass_hz: 300
  low_pass_hz: 3400
  volume_db_reduction: 3
