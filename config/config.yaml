tts:
  engine: cosyvoice
  default_rate: "+0%"
  kokoro:
    lang_code: a
    sample_rate: 24000
    # null uses Kokoro's default device; set "cpu" to force CPU inference.
    device: null
    voice_map:
      counsellor: af_heart
      caller: am_adam
  cosyvoice:
    # CosyVoice3's dependencies live in their own virtual environment,
    # separate from this project's .venv, so synthesis runs in a subprocess
    # started with this interpreter (paths below are relative to the repo
    # root unless given as absolute paths).
    # Semantic rate/speed and arousal/coarse-affect instruction mappings are
    # provisional backend adapters pending controlled benchmark evaluation.
    python_bin: third_party/CosyVoice/.venv/bin/python
    repo_dir: third_party/CosyVoice
    model_dir: models/Fun-CosyVoice3-0.5B
    load_trt: false
    load_vllm: false
    fp16: true
    # Zero-shot voice cloning: each speaker needs a short reference clip
    # (prompt_wav) and the transcript of that clip (prompt_text). Both
    # roles are pointed at CosyVoice's bundled sample clip for now. Replace
    # them with two distinct reference clips before real use, otherwise
    # counsellor and caller will sound identical.
    voice_map:
      counsellor:
        prompt_wav: third_party/CosyVoice/asset/zero_shot_prompt.wav
        prompt_text: >-
          You are a helpful assistant.<|endofprompt|>希望你以后能够做的比我还好呦。
      caller:
        prompt_wav: third_party/CosyVoice/asset/zero_shot_prompt.wav
        prompt_text: >-
          You are a helpful assistant.<|endofprompt|>希望你以后能够做的比我还好呦。

pause:
  default_ms: 500

# Short fade applied to the beginning and end of each turn (milliseconds).
# It removes hard-cut clicks without crossfading turns or affecting metadata timestamps.
fade_ms: 5

telephone:
  sample_rate: 8000
  channels: 1
  high_pass_hz: 300
  low_pass_hz: 3400
  volume_db_reduction: 3
