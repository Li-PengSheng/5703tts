# Illustrative Google Cloud configuration for the primary Higgs backend.
# Replace every path after approving real runtime/reference assets; config
# loading validates structure but does not assert path existence.
tts:
  engine: higgs
  default_rate: normal
  higgs:
    server_executable: /path/to/sgl-omni
    model_dir: /path/to/higgs
    host: 127.0.0.1
    port: 18080
    startup_timeout_seconds: 900
    inference_timeout_seconds: 300
    ffmpeg_bin: ffmpeg
    voice_map:
      spk_001:
        reference_wav: refs/approved_higgs_spk_001.wav

pause:
  default_ms: 500

fade_ms: 5

telephone:
  sample_rate: 8000
  channels: 1
  high_pass_hz: 300
  low_pass_hz: 3400
  volume_db_reduction: 3
