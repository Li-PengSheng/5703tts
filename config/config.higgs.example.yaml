# Illustrative Google Cloud configuration for the primary Higgs backend.
# Replace runtime paths before deployment. Speaker references are supplied by
# --speaker-sidecar, not this file.
tts:
  engine: higgs
  higgs:
    server_executable: /path/to/sgl-omni
    model_dir: /path/to/higgs
    host: 127.0.0.1
    port: 18080
    startup_timeout_seconds: 900
    inference_timeout_seconds: 300
    ffmpeg_bin: ffmpeg

fade_ms: 5

telephone:
  sample_rate: 8000
  channels: 1
  high_pass_hz: 300
  low_pass_hz: 3400
  volume_db_reduction: 3
